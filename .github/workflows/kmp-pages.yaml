# Publishes the browser build of the shared UI to GitHub Pages.
#
# The point is not hosting. It is that a URL is the only way to put this in front of somebody with
# an iPhone without a Mac, an Apple developer account and a provisioning profile between them and
# the demo. Safari on iOS runs the WebAssembly build, so what a caver's own phone renders is the
# ported survey core and the shared Compose UI, drawn by Skia, taking real touch input on real iOS
# hardware.
#
# That is emphatically NOT the same as the native Kotlin/Native build, and the README says so. What
# it does settle is the half of the question that does not depend on Apple's toolchain: whether
# this UI is usable on a phone-shaped iOS screen, with a finger, by a caver. It costs one workflow
# and answers that in ten seconds instead of a week.
#
# Requires the repository's Pages source to be set to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source).
name: KMP browser demo

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'kmp/**'
      - '.github/workflows/kmp-pages.yaml'
  workflow_dispatch:

# One deployment at a time, and let a newer push win rather than queue behind an older one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build the browser demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: kmp
        run: ./gradlew :demo:wasmJsBrowserDistribution

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: kmp/demo/build/dist/wasmJs/productionExecutable

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
