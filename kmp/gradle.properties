org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
kotlin.code.style=official

# Lets the iOS targets be *declared* on a non-macOS host (they simply cannot be
# compiled there). Without this, configuring the build on Linux/Windows fails.
kotlin.native.ignoreDisabledTargets=true

# Compose Multiplatform
org.jetbrains.compose.experimental.wasm.enabled=true

# Android
# AndroidX is not optional for Compose; AGP wants it said out loud.
android.useAndroidX=true
# Two Android targets in the tree (:shared and :demo) plus one application; without this AGP
# generates a BuildConfig class per module that nothing uses.
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true
