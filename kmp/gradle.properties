org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
kotlin.code.style=official

# Lets the iOS targets be *declared* on a non-macOS host (they simply cannot be
# compiled there). Without this, configuring the build on Linux/Windows fails.
kotlin.native.ignoreDisabledTargets=true

# Compose Multiplatform
org.jetbrains.compose.experimental.wasm.enabled=true

# Android
# AGP 9 dropped support for the classic 'com.android.library'/'com.android.application' +
# 'kotlin("multiplatform")' combination in favor of a new 'com.android.kotlin.multiplatform.library'
# plugin with its own DSL. Migrating :shared and :demo to that plugin is a separate piece of work;
# these two properties keep AGP on its pre-9.0 Kotlin-multiplatform interop so the existing
# androidTarget {} setup keeps working under AGP 9.2.1.
android.builtInKotlin=false
android.newDsl=false
# AndroidX is not optional for Compose; AGP wants it said out loud.
android.useAndroidX=true
# Two Android targets in the tree (:shared and :demo) plus one application; without this AGP
# generates a BuildConfig class per module that nothing uses.
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true
